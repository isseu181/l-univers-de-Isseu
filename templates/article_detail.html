<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article.title }}</title>
    <!-- Inclure Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Contenu principal -->
    <div class="container mt-5">
        <h1>{{ article.title }}</h1>
        {% if article.image %}
            <img src="{{ article.image.url }}" class="img-fluid mb-4" alt="{{ article.title }}">
        {% endif %}
        <p>{{ article.content }}</p>
        <p><strong>Auteur : </strong>{{ article.author }}</p>
        <p><strong>Date de publication : </strong>{{ article.published_date }}</p>
        <a href="{% url 'home' %}" class="btn btn-secondary mt-4">Retour à la liste des articles</a>
    </div>

    <!-- Inclure les scripts Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
